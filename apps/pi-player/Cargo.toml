[package]
name = "showroom-player"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Native Raspberry Pi player for Showroom screens: libmpv straight to DRM/KMS, no X11 or browser."
publish = false

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
