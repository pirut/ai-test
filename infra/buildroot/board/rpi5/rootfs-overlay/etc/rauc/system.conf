# A/B OS slots for Showroom OS on the Raspberry Pi 5. Each slot is a FAT boot
# partition (kernel, DTBs, config.txt, cmdline.txt) plus an EROFS root. The
# partition UUIDs come from the fixed disk signature in post-image.sh.
[system]
compatible=showroom-rpi5
bootloader=custom
data-directory=/data/rauc
bundle-formats=-plain

[keyring]
path=/etc/rauc/keyring.pem

[handlers]
bootloader-custom-backend=/usr/libexec/showroom/rauc-tryboot-backend

[slot.rootfs.0]
device=/dev/disk/by-partuuid/53484f57-05
type=raw
bootname=A

[slot.boot.0]
device=/dev/disk/by-partuuid/53484f57-02
type=vfat
parent=rootfs.0

[slot.rootfs.1]
device=/dev/disk/by-partuuid/53484f57-06
type=raw
bootname=B

[slot.boot.1]
device=/dev/disk/by-partuuid/53484f57-03
type=vfat
parent=rootfs.1
