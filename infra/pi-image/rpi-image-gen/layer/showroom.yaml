# METABEGIN
# X-Env-Layer-Name: showroom-appliance
# X-Env-Layer-Version: 1.0.0
# X-Env-Layer-Category: application
# X-Env-Layer-Desc: Immutable Digital Curator signage appliance with local playback,
#  persistent identity and cache, hardware watchdogs, and Connect OTA recovery.
# X-Env-Layer-Requires: device-user-admin,rpi-connect-lite,rpi-connect-ota
# METAEND
---
mmdebstrap:
  packages:
    - ca-certificates
    - chromium
    - curl
    - ffmpeg
    - iputils-ping
    - iproute2
    - jq
    - kbd
    - mpv
    - openbox
    - procps
    - python3-xdg
    - scrot
    - unclutter
    - xinit
    - x11-xserver-utils
    - xserver-xorg
    - xserver-xorg-legacy
    - sudo
    - util-linux
    - wpasupplicant
    - yt-dlp
