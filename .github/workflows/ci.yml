name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: aarch64-unknown-linux-gnu
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: cargo fmt --manifest-path apps/pi-player/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path apps/pi-player/Cargo.toml --all-targets -- -D warnings
      - run: cargo build --locked --release --manifest-path apps/pi-player/Cargo.toml --target aarch64-unknown-linux-gnu
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      - run: bash -n infra/pi-image/*.sh infra/pi-image/systemd/showroom-* scripts/*.sh
      - run: ./infra/pi-image/validate-appliance.sh --source
